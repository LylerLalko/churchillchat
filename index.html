<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wikipedia</title>
  <style>
    body {
      background: #e6edf1;
      color: #1c2a35;
      font-family: "Trebuchet MS", sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    input, button, select {
      font-size: 1rem;
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px solid #b9c8d2;
    }
    button {
      background: #ccccff;
      border-color: #e9e9ff;
      color: white;
      cursor: pointer;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    #newRoomBox {
      width: 120px;
    }
    #messages {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .message {
      background: white;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 80%;
      align-self: flex-start;
      overflow-wrap: anywhere;
    }
    .message.mine {
      background: #ccccff;
      color: white;
      align-self: flex-end;
    }
    .sender {
      font-weight: bold;
      color: #60beff;
    }
    .mine .sender {
      color: #d6eef2;
    }
    .time {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-left: 8px;
    }
    .hidden {
      display: none;
    }
      /* Dark mode */
body.dark {
  background: #121212;
  color: #eee;
}

body.dark #chatScreen {
  background: #121212;
}

body.dark input,
body.dark select {
  background: #1e1e1e;
  color: #eee;
  border-color: #444;
}

body.dark button {
  background: #2a2a2a;
  color: #eee;
  border-color: #555;
}

body.dark button:hover {
  background: #3a3a3a;
}

body.dark #messages {
  background: #181818;
}

body.dark .message {
  background: #242424;
}

body.dark .sender {
  color: #fff;
}
/* Themes */

body {
  --bg: #ffffff;
  --text: #111111;
  --input-bg: #ffffff;
  --button-bg: #eeeeee;
  --message-bg: #f0f0f0;
  --accent: #333333;

  background: var(--bg);
  color: var(--text);
}

body.dark {
  --bg: #121212;
  --text: #eeeeee;
  --input-bg: #1e1e1e;
  --button-bg: #2a2a2a;
  --message-bg: #242424;
  --accent: #ffffff;
}

body.blue {
  --bg: #eaf3ff;
  --text: #102a43;
  --input-bg: #ffffff;
  --button-bg: #cfe3ff;
  --message-bg: #dcecff;
  --accent: #1769aa;
}

body.purple {
  --bg: #f4eaff;
  --text: #28143d;
  --input-bg: #ffffff;
  --button-bg: #e4ccff;
  --message-bg: #eadcff;
  --accent: #7b2cbf;
}

body.green {
  --bg: #eaffea;
  --text: #143d1c;
  --input-bg: #ffffff;
  --button-bg: #cceccc;
  --message-bg: #d9f2d9;
  --accent: #238636;
}

body.red {
  --bg: #ffeaea;
  --text: #3d1414;
  --input-bg: #ffffff;
  --button-bg: #ffcccc;
  --message-bg: #f5d9d9;
  --accent: #c62828;
}

body.yellow {
  --bg: #fffbe0;
  --text: #3d3514;
  --input-bg: #ffffff;
  --button-bg: #fff0a8;
  --message-bg: #fff5c7;
  --accent: #9a7b00;
}

body input,
body select {
  background: var(--input-bg);
  color: var(--text);
}

body button {
  background: var(--button-bg);
  color: var(--text);
}

body .message {
  background: var(--message-bg);
}

body .sender {
  color: var(--accent);
}
#typingIndicator {
  font-size: 13px;
  font-style: italic;
  color: #687782;
  min-height: 18px;
  margin-bottom: 8px;
}
    
.avatar-picker {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 12px 0;
  max-width: 250px;
}

.avatar-picker label {
  font-size: 14px;
  font-weight: bold;
}

.avatar-picker select {
  width: 100%;
}

.avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  margin-right: 7px;
  vertical-align: middle;
  font-size: 18px;
  flex-shrink: 0;
}

  </style>
</head>
<body>

  <div id="joinScreen">
    <h1>Join the chat</h1>
    
<input id="nameBox" placeholder="Pick a name" maxlength="20">

<div class="avatar-picker">
  <label for="avatarEmoji">Profile emoji</label>
  <select id="avatarEmoji">
    <option value="😂">😂 Cry Laugh</option>
    <option value="💔">💔 Heart</option>
    <option value="😭">😭 Sobbing</option>
    <option value="🔥">🔥 Fire</option>
    <option value="🗿">🗿 Moai</option>
    <option value="🥀">🥀 Rose</option>
    <option value="🤤">🤤 Drool</option>
    <option value="💀">💀 Skull</option>
    <option value="🙏">🙏 Praying</option>
    <option value="🥹">🥹 Water Eyes</option>
    <option value="😢">😢 Crying</option>
    <option value="🦆">🦆 Duck</option>
    <option value="🤡">🤡 Clown</option>
  </select>

  <label for="avatarColor">Avatar color</label>
  <select id="avatarColor">
    <option value="#64748b">Slate</option>
    <option value="#e74c3c">Red</option>
    <option value="#e67e22">Orange</option>
    <option value="#f1c40f">Yellow</option>
    <option value="#27ae60">Green</option>
    <option value="#3498db">Blue</option>
    <option value="#8e44ad">Purple</option>
    <option value="#e84393">Pink</option>
    <option value="#34495e">Dark gray</option>
  </select>
</div>

<input id="passwordBox" type="password"
       placeholder="Password (Only for real Lyler)" maxlength="50">

<button id="joinButton">Join</button>

  </div>

  <div id="chatScreen" class="hidden">
    <h1>Churchill Chat Room - They blocked messages so I made my own >:)</h1>
    <div class="toolbar">
      <select id="roomSelect"></select>
      <button id="copyButton" title="Copy invite link">Invite</button>
      <button id="leaveButton" title="Leave this room">Leave</button>
      <button id="soundButton" title="Toggle notification sound">🔔</button>
      <button id="darkModeButton" title="Toggle dark mode">🌙</button>
        <select id="themeSelect">
  <option value="light">☀️ Light</option>
  <option value="dark">🌙 Dark</option>
  <option value="blue">🔵 Blue</option>
  <option value="purple">🟣 Purple</option>
  <option value="green">🟢 Green</option>
  <option value="red">🔴 Red</option>
  <option value="yellow">🟡 Yellow</option>
</select>
    </div>
    <div class="toolbar">
      <input id="newRoomBox" placeholder="Room code" maxlength="20">
      <button id="newRoomButton">Join</button>
      <button id="makeCodeButton">New code</button>
    </div>
    <div id="messages"></div>
    <input id="messageBox" placeholder="Type a message" maxlength="500">
    <button id="sendButton">Send</button>
    <div id="typingIndicator"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script>
    const joinScreen = document.getElementById("joinScreen");
    const chatScreen = document.getElementById("chatScreen");
    const nameBox = document.getElementById("nameBox");
    const joinButton = document.getElementById("joinButton");
    const messageBox = document.getElementById("messageBox");
    const sendButton = document.getElementById("sendButton");
    const messages = document.getElementById("messages");
    const roomSelect = document.getElementById("roomSelect");
    const newRoomBox = document.getElementById("newRoomBox");
    const newRoomButton = document.getElementById("newRoomButton");
    const makeCodeButton = document.getElementById("makeCodeButton");
    const copyButton = document.getElementById("copyButton");
    const leaveButton = document.getElementById("leaveButton");
    const soundButton = document.getElementById("soundButton");
    const passwordBox = document.getElementById("passwordBox");
    
const avatarEmojiBox = document.getElementById("avatarEmoji");
const avatarColorBox = document.getElementById("avatarColor");

// Restore the saved avatar choices.
avatarEmojiBox.value = localStorage.getItem("chatAvatar") || "🙂";
avatarColorBox.value = localStorage.getItem("chatAvatarColor") || "#64748b";

let myAvatar = avatarEmojiBox.value;
let myAvatarColor = avatarColorBox.value;

    

    // Change this to your own long random text.
    const SITE_KEY = "Version5WithJoinFix";
    const BASE = "ChurChat/" + SITE_KEY;
    const MAX_SHOWN = 50;
    const typingIndicator = document.getElementById("typingIndicator");
const typingUsers = new Map();
let lastTypingSent = 0;


    // ---- WORD FILTER: add your own words to this list ----
    const BLOCKED_WORDS = ["Braddock", "BRADDOCK", "Retard"];

    let myName = "";
    let currentRoom = "";
    let roomTopic = "";
    let enteredAt = 0;
    const allMessages = [];
    const seenIds = new Set();

    let myId = localStorage.getItem("chatUserId");
    if (!myId) {
      myId = Math.random().toString(36).slice(2);
      localStorage.setItem("chatUserId", myId);
    }
    nameBox.value = localStorage.getItem("chatName") || "";

    // ---------- FILTER ----------
    function clean(text) {
      let result = text;
      BLOCKED_WORDS.forEach(function (word) {
        const safe = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const pattern = new RegExp("\\b" + safe + "\\b", "gi");
        result = result.replace(pattern, function (match) {
          return "*".repeat(match.length);
        });
      });
      return result;
    }

    // ---------- SOUND ----------
    let soundOn = localStorage.getItem("chatSound") !== "off";
    let audioCtx = null;

    function updateSoundButton() {
      soundButton.textContent = soundOn ? "🔔" : "🔕";
    }

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function beep() {
      if (!soundOn || !audioCtx) {
        return;
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    soundButton.addEventListener("click", function () {
      soundOn = !soundOn;
      localStorage.setItem("chatSound", soundOn ? "on" : "off");
      updateSoundButton();
      unlockAudio();
      beep();
    });
    updateSoundButton();

    // ---------- ROOMS (joined by secret code) ----------
    function cleanRoomName(raw) {
      return raw.trim().toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9-]/g, "").slice(0, 20);
    }

    // Rooms I've joined, saved in this browser only. "general" is always there.
    let myRooms = ["general"];
    try {
      const saved = JSON.parse(localStorage.getItem("chatRooms") || "[]");
      saved.forEach(function (name) {
        if (typeof name === "string" && cleanRoomName(name) === name && name !== "general") {
          myRooms.push(name);
        }
      });
    } catch (e) {}

    function saveRooms() {
      localStorage.setItem("chatRooms", JSON.stringify(myRooms.filter(function (r) {
        return r !== "general";
      })));
    }

    function makeCode() {
      const chars = "abcdefghjkmnpqrstuvwxyz23456789";
      let code = "";
      do {
        const bytes = crypto.getRandomValues(new Uint8Array(8));
        code = Array.from(bytes, function (b) {
          return chars[b % chars.length];
        }).join("");
      } while (clean(code) !== code);
      return code;
    }

    function updateRoomList() {
      roomSelect.innerHTML = "";
      myRooms.forEach(function (name) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name === "general" ? "# general (public lobby)" : "🔒 " + name;
        option.selected = name === currentRoom;
        roomSelect.appendChild(option);
      });
    }

    // Returns "" on success, or a message explaining what went wrong.
    function switchRoom(raw) {
      const name = cleanRoomName(raw);
      if (name === currentRoom) {
        return "";
      }
      if (name.length < 3) {
        return "A room code needs at least 3 letters or numbers.";
      }
      if (clean(name) !== name) {
        return "That code isn't allowed.";
      }
      if (currentRoom && client.connected) {
        client.unsubscribe(roomTopic + "/#");
      }
      currentRoom = name;
      roomTopic = BASE + "/r/" + name;
      allMessages.length = 0;
      seenIds.clear();
      enteredAt = Date.now();
      if (myRooms.indexOf(name) === -1) {
        myRooms.push(name);
        saveRooms();
      }
      updateRoomList();
      render();
      if (client.connected) {
        client.subscribe(roomTopic + "/#");
      }
      try {
        history.replaceState(null, "", "?room=" + name);
      } catch (e) {}
      return "";
    }

    function tryJoinRoom(raw) {
      const problem = switchRoom(raw);
      if (problem !== "") {
        alert(problem);
        updateRoomList();
      }
    }

    roomSelect.addEventListener("change", function () {
      tryJoinRoom(roomSelect.value);
    });
    newRoomButton.addEventListener("click", function () {
      tryJoinRoom(newRoomBox.value);
      newRoomBox.value = "";
    });
    newRoomBox.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        newRoomButton.click();
      }
    });
    makeCodeButton.addEventListener("click", function () {
      tryJoinRoom(makeCode());
    });

    copyButton.addEventListener("click", function () {
      const link = location.origin + location.pathname + "?room=" + currentRoom;
      navigator.clipboard.writeText(link).then(function () {
        copyButton.textContent = "Copied!";
        setTimeout(function () {
          copyButton.textContent = "Invite";
        }, 1500);
      }, function () {
        window.prompt("Copy this link:", link);
      });
    });

    leaveButton.addEventListener("click", function () {
      if (currentRoom === "general") {
        return;
      }
      const leaving = currentRoom;
      if (client.connected) {
        client.unsubscribe(roomTopic + "/#");
      }
      myRooms = myRooms.filter(function (r) {
        return r !== leaving;
      });
      saveRooms();
      currentRoom = "";
      switchRoom("general");
    });

    // ---------- CONNECTION ----------
    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

    client.on("connect", function () {
      if (currentRoom) {
        client.subscribe(roomTopic + "/#");
      }
    });

    client.on("message", function (topic, data) {
      if (topic === roomTopic + "/typing") {
  try {
    const info = JSON.parse(data.toString());

    if (info.userId === myId) return;

    if (info.typing && info.name) {
      typingUsers.set(info.userId, {
        name: info.name,
        time: Date.now()
      });
    } else {
      typingUsers.delete(info.userId);
    }

    updateTypingIndicator();
  } catch (e) {}

  return;
}
      if (data.length === 0 || !roomTopic || !topic.startsWith(roomTopic + "/")) {
        return;
      }
      let msg;
      try {
        msg = JSON.parse(data.toString());
      } catch (e) {
        return;
      }
      if (typeof msg.id !== "string" || typeof msg.name !== "string" ||
          typeof msg.text !== "string" || typeof msg.time !== "number") {
        return;
      }
      if (seenIds.has(msg.id)) {
        return;
      }
      seenIds.add(msg.id);

      allMessages.push(msg);
      allMessages.sort(function (a, b) {
        return a.time - b.time;
      });
      if (allMessages.length > MAX_SHOWN) {
        allMessages.shift();
      }
      render();

      if (msg.userId !== myId && msg.time > enteredAt) {
        beep();
      }
    });
function updateTypingIndicator() {
  const now = Date.now();

  typingUsers.forEach(function (user, id) {
    if (now - user.time > 4000) {
      typingUsers.delete(id);
    }
  });

  const names = Array.from(typingUsers.values())
    .map(function (user) { return user.name; });

  if (names.length === 0) {
    typingIndicator.textContent = "";
  } else if (names.length === 1) {
    typingIndicator.textContent = names[0] + " is typing...";
  } else {
    typingIndicator.textContent =
      names.slice(0, -1).join(", ") + " and " +
      names[names.length - 1] + " are typing...";
  }
}

setInterval(updateTypingIndicator, 1000);
    // ---------- DISPLAY ----------
    function render() {
      messages.innerHTML = "";
      allMessages.forEach(showMessage);
      window.scrollTo(0, document.body.scrollHeight);
    }

    function showMessage(msg) {
      const bubble = document.createElement("div");
      bubble.className = "message";
      if (msg.userId === myId) {
        bubble.classList.add("mine");
      }
      
const avatar = document.createElement("span");
avatar.className = "avatar";
avatar.textContent = msg.avatar || "🙂";
avatar.style.backgroundColor = msg.avatarColor || "#64748b";

      const sender = document.createElement("span");
      sender.className = "sender";
      sender.textContent = clean(msg.name.slice(0, 20));

      const when = document.createElement("span");
      when.className = "time";
      when.textContent = new Date(msg.time).toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      });

      const body = document.createElement("div");
      body.textContent = clean(msg.text.slice(0, 500));

      
bubble.appendChild(avatar);
bubble.appendChild(sender);
bubble.appendChild(when);

      bubble.appendChild(body);
      messages.appendChild(bubble);
    }

    // ---------- JOIN + SEND ----------
    function join() {
  const name = nameBox.value.trim();

  if (name === "") {
    return;
  }

  // Braddock requires a password
  if (name.toLowerCase() === "lyler") {
    if (passwordBox.value !== "LavenderRocks2021") {
      alert("Wrong password haha pick something else");
      return;
    }
  }

  
myName = name;

myAvatar = avatarEmojiBox.value;
myAvatarColor = avatarColorBox.value;

localStorage.setItem("chatName", name);
localStorage.setItem("chatAvatar", myAvatar);
localStorage.setItem("chatAvatarColor", myAvatarColor);

  unlockAudio();
  joinScreen.classList.add("hidden");
  chatScreen.classList.remove("hidden");

  // An invite link lands you straight in that room.
  const startRoom = new URLSearchParams(location.search).get("room") || "general";

  if (switchRoom(startRoom) !== "") {
    switchRoom("general");
  }

  messageBox.focus();
}

    function sendMessage() {
      const text = messageBox.value.trim();
      if (text === "" || !currentRoom) {
        return;
      }
      const id = Date.now() + "-" + Math.random().toString(36).slice(2);
      
const msg = {
  id: id,
  userId: myId,
  name: myName,
  avatar: myAvatar,
  avatarColor: myAvatarColor,
  text: text,
  time: Date.now()
};

      client.publish(roomTopic + "/" + id, JSON.stringify(msg), { retain: true });
      messageBox.value = "";
    }
const themeSelect = document.getElementById("themeSelect");

let savedTheme = localStorage.getItem("chatTheme") || "light";

function applyTheme() {
  document.body.classList.remove(
    "dark",
    "blue",
    "purple",
    "green",
    "red",
    "yellow"
  );

  if (savedTheme !== "light") {
    document.body.classList.add(savedTheme);
  }

  themeSelect.value = savedTheme;
}

themeSelect.addEventListener("change", function () {
  savedTheme = themeSelect.value;
  localStorage.setItem("chatTheme", savedTheme);
  applyTheme();
});

applyTheme();
    messageBox.addEventListener("input", function () {
  if (!currentRoom || !myName || !client.connected) return;

  const now = Date.now();
  if (now - lastTypingSent < 1000) return;
  lastTypingSent = now;

  client.publish(
    roomTopic + "/typing",
    JSON.stringify({
      userId: myId,
      name: myName,
      typing: messageBox.value.length > 0
    })
  );
});
    joinButton.addEventListener("click", join);
    sendButton.addEventListener("click", sendMessage);
    nameBox.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        join();
      }
    });
    messageBox.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  const darkModeButton = document.getElementById("darkModeButton");

let darkMode = localStorage.getItem("darkMode") === "on";

function updateDarkMode() {
  document.body.classList.toggle("dark", darkMode);
  darkModeButton.textContent = darkMode ? "☀️" : "🌙";
}

darkModeButton.addEventListener("click", function () {
  darkMode = !darkMode;

  localStorage.setItem(
    "darkMode",
    darkMode ? "on" : "off"
  );

  updateDarkMode();
});

updateDarkMode();
  </script>
</body>
</html>
