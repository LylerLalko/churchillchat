<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wikipedia</title>
  <style>
    body {
      background: #e6edf1;
      color: #1c2a35;
      font-family: "Trebuchet MS", sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    input, button, select {
      font-size: 1rem;
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px solid #b9c8d2;
    }
    button {
      background: #ccccff;
      border-color: #e9e9ff;
      color: white;
      cursor: pointer;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    #newRoomBox {
      width: 120px;
    }
    #messages {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .message {
      background: white;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 80%;
      align-self: flex-start;
      overflow-wrap: anywhere;
    }
    .message.mine {
      background: #ccccff;
      color: white;
      align-self: flex-end;
    }
    .sender {
      font-weight: bold;
      color: #60beff;
    }
    .mine .sender {
      color: #d6eef2;
    }
    .time {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-left: 8px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div id="joinScreen">
    <h1>Join the chat</h1>
    <input id="nameBox" placeholder="Pick a name" maxlength="20">
    <button id="joinButton">Join</button>
  </div>

  <div id="chatScreen" class="hidden">
    <h1>Churchill Chat Room - They blocked messages so I made my own >:)</h1>
    <div class="toolbar">
      <select id="roomSelect"></select>
      <button id="copyButton" title="Copy invite link">Invite</button>
      <button id="leaveButton" title="Leave this room">Leave</button>
      <button id="soundButton" title="Toggle notification sound">🔔</button>
    </div>
    <div class="toolbar">
      <input id="newRoomBox" placeholder="Room code" maxlength="20">
      <button id="newRoomButton">Join</button>
      <button id="makeCodeButton">New code</button>
    </div>
    <div id="messages"></div>
    <input id="messageBox" placeholder="Type a message" maxlength="500">
    <button id="sendButton">Send</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script>
    const joinScreen = document.getElementById("joinScreen");
    const chatScreen = document.getElementById("chatScreen");
    const nameBox = document.getElementById("nameBox");
    const joinButton = document.getElementById("joinButton");
    const messageBox = document.getElementById("messageBox");
    const sendButton = document.getElementById("sendButton");
    const messages = document.getElementById("messages");
    const roomSelect = document.getElementById("roomSelect");
    const newRoomBox = document.getElementById("newRoomBox");
    const newRoomButton = document.getElementById("newRoomButton");
    const makeCodeButton = document.getElementById("makeCodeButton");
    const copyButton = document.getElementById("copyButton");
    const leaveButton = document.getElementById("leaveButton");
    const soundButton = document.getElementById("soundButton");

    // Change this to your own long random text.
    const SITE_KEY = "Version5WithJoinFix";
    const BASE = "ChurChat/" + SITE_KEY;
    const MAX_SHOWN = 50;

    // ---- WORD FILTER: add your own words to this list ----
    const BLOCKED_WORDS = ["Braddock", "BRADDOCK", "Retard"];

    let myName = "";
    let currentRoom = "";
    let roomTopic = "";
    let enteredAt = 0;
    const allMessages = [];
    const seenIds = new Set();

    let myId = localStorage.getItem("chatUserId");
    if (!myId) {
      myId = Math.random().toString(36).slice(2);
      localStorage.setItem("chatUserId", myId);
    }
    nameBox.value = localStorage.getItem("chatName") || "";

    // ---------- FILTER ----------
    function clean(text) {
      let result = text;
      BLOCKED_WORDS.forEach(function (word) {
        const safe = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const pattern = new RegExp("\\b" + safe + "\\b", "gi");
        result = result.replace(pattern, function (match) {
          return "*".repeat(match.length);
        });
      });
      return result;
    }

    // ---------- SOUND ----------
    let soundOn = localStorage.getItem("chatSound") !== "off";
    let audioCtx = null;

    function updateSoundButton() {
      soundButton.textContent = soundOn ? "🔔" : "🔕";
    }

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function beep() {
      if (!soundOn || !audioCtx) {
        return;
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    soundButton.addEventListener("click", function () {
      soundOn = !soundOn;
      localStorage.setItem("chatSound", soundOn ? "on" : "off");
      updateSoundButton();
      unlockAudio();
      beep();
    });
    updateSoundButton();

    // ---------- ROOMS (joined by secret code) ----------
    function cleanRoomName(raw) {
      return raw.trim().toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9-]/g, "").slice(0, 20);
    }

    // Rooms I've joined, saved in this browser only. "general" is always there.
    let myRooms = ["general"];
    try {
      const saved = JSON.parse(localStorage.getItem("chatRooms") || "[]");
      saved.forEach(function (name) {
        if (typeof name === "string" && cleanRoomName(name) === name && name !== "general") {
          myRooms.push(name);
        }
      });
    } catch (e) {}

    function saveRooms() {
      localStorage.setItem("chatRooms", JSON.stringify(myRooms.filter(function (r) {
        return r !== "general";
      })));
    }

    function makeCode() {
      const chars = "abcdefghjkmnpqrstuvwxyz23456789";
      let code = "";
      do {
        const bytes = crypto.getRandomValues(new Uint8Array(8));
        code = Array.from(bytes, function (b) {
          return chars[b % chars.length];
        }).join("");
      } while (clean(code) !== code);
      return code;
    }

    function updateRoomList() {
      roomSelect.innerHTML = "";
      myRooms.forEach(function (name) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name === "general" ? "# general (public lobby)" : "🔒 " + name;
        option.selected = name === currentRoom;
        roomSelect.appendChild(option);
      });
    }

    // Returns "" on success, or a message explaining what went wrong.
    function switchRoom(raw) {
      const name = cleanRoomName(raw);
      if (name === currentRoom) {
        return "";
      }
      if (name.length < 3) {
        return "A room code needs at least 3 letters or numbers.";
      }
      if (clean(name) !== name) {
        return "That code isn't allowed.";
      }
      if (currentRoom && client.connected) {
        client.unsubscribe(roomTopic + "/#");
      }
      currentRoom = name;
      roomTopic = BASE + "/r/" + name;
      allMessages.length = 0;
      seenIds.clear();
      enteredAt = Date.now();
      if (myRooms.indexOf(name) === -1) {
        myRooms.push(name);
        saveRooms();
      }
      updateRoomList();
      render();
      if (client.connected) {
        client.subscribe(roomTopic + "/#");
      }
      try {
        history.replaceState(null, "", "?room=" + name);
      } catch (e) {}
      return "";
    }

    function tryJoinRoom(raw) {
      const problem = switchRoom(raw);
      if (problem !== "") {
        alert(problem);
        updateRoomList();
      }
    }

    roomSelect.addEventListener("change", function () {
      tryJoinRoom(roomSelect.value);
    });
    newRoomButton.addEventListener("click", function () {
      tryJoinRoom(newRoomBox.value);
      newRoomBox.value = "";
    });
    newRoomBox.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        newRoomButton.click();
      }
    });
    makeCodeButton.addEventListener("click", function () {
      tryJoinRoom(makeCode());
    });

    copyButton.addEventListener("click", function () {
      const link = location.origin + location.pathname + "?room=" + currentRoom;
      navigator.clipboard.writeText(link).then(function () {
        copyButton.textContent = "Copied!";
        setTimeout(function () {
          copyButton.textContent = "Invite";
        }, 1500);
      }, function () {
        window.prompt("Copy this link:", link);
      });
    });

    leaveButton.addEventListener("click", function () {
      if (currentRoom === "general") {
        return;
      }
      const leaving = currentRoom;
      if (client.connected) {
        client.unsubscribe(roomTopic + "/#");
      }
      myRooms = myRooms.filter(function (r) {
        return r !== leaving;
      });
      saveRooms();
      currentRoom = "";
      switchRoom("general");
    });

    // ---------- CONNECTION ----------
    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

    client.on("connect", function () {
      if (currentRoom) {
        client.subscribe(roomTopic + "/#");
      }
    });

    client.on("message", function (topic, data) {
      if (data.length === 0 || !roomTopic || !topic.startsWith(roomTopic + "/")) {
        return;
      }
      let msg;
      try {
        msg = JSON.parse(data.toString());
      } catch (e) {
        return;
      }
      if (typeof msg.id !== "string" || typeof msg.name !== "string" ||
          typeof msg.text !== "string" || typeof msg.time !== "number") {
        return;
      }
      if (seenIds.has(msg.id)) {
        return;
      }
      seenIds.add(msg.id);

      allMessages.push(msg);
      allMessages.sort(function (a, b) {
        return a.time - b.time;
      });
      if (allMessages.length > MAX_SHOWN) {
        allMessages.shift();
      }
      render();

      if (msg.userId !== myId && msg.time > enteredAt) {
        beep();
      }
    });

    // ---------- DISPLAY ----------
    function render() {
      messages.innerHTML = "";
      allMessages.forEach(showMessage);
      window.scrollTo(0, document.body.scrollHeight);
    }

    function showMessage(msg) {
      const bubble = document.createElement("div");
      bubble.className = "message";
      if (msg.userId === myId) {
        bubble.classList.add("mine");
      }

      const sender = document.createElement("span");
      sender.className = "sender";
      sender.textContent = clean(msg.name.slice(0, 20));

      const when = document.createElement("span");
      when.className = "time";
      when.textContent = new Date(msg.time).toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      });

      const body = document.createElement("div");
      body.textContent = clean(msg.text.slice(0, 500));

      bubble.appendChild(sender);
      bubble.appendChild(when);
      bubble.appendChild(body);
      messages.appendChild(bubble);
    }

    // ---------- JOIN + SEND ----------
    function join() {
      const name = nameBox.value.trim();
      if (name === "") {
        return;
      }
      myName = name;
      localStorage.setItem("chatName", name);
      unlockAudio();
      joinScreen.classList.add("hidden");
      chatScreen.classList.remove("hidden");

      // An invite link lands you straight in that room.
      const startRoom = new URLSearchParams(location.search).get("room") || "general";
      if (switchRoom(startRoom) !== "") {
        switchRoom("general");
      }
      messageBox.focus();
    }

    function sendMessage() {
      const text = messageBox.value.trim();
      if (text === "" || !currentRoom) {
        return;
      }
      const id = Date.now() + "-" + Math.random().toString(36).slice(2);
      const msg = { id: id, userId: myId, name: myName, text: text, time: Date.now() };
      client.publish(roomTopic + "/" + id, JSON.stringify(msg), { retain: true });
      messageBox.value = "";
    }

    joinButton.addEventListener("click", join);
    sendButton.addEventListener("click", sendMessage);
    nameBox.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        join();
      }
    });
    messageBox.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
