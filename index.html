<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Chatroom</title>
  <style>
    body {
      background: #e6edf1;
      color: #1c2a35;
      font-family: "Trebuchet MS", sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    input, button, select {
      font-size: 1rem;
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px solid #b9c8d2;
    }
    button {
      background: #1f7a8c;
      border-color: #1f7a8c;
      color: white;
      cursor: pointer;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    #newRoomBox {
      width: 120px;
    }
    #messages {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .message {
      background: white;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 80%;
      align-self: flex-start;
      overflow-wrap: anywhere;
    }
    .message.mine {
      background: #1f7a8c;
      color: white;
      align-self: flex-end;
    }
    .sender {
      font-weight: bold;
      color: #1f7a8c;
    }
    .mine .sender {
      color: #d6eef2;
    }
    .time {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-left: 8px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div id="joinScreen">
    <h1>Join the chat</h1>
    <input id="nameBox" placeholder="Pick a name" maxlength="20">
    <button id="joinButton">Join</button>
  </div>

  <div id="chatScreen" class="hidden">
    <h1>My Chatroom</h1>
    <div class="toolbar">
      <select id="roomSelect"></select>
      <input id="newRoomBox" placeholder="New room" maxlength="20">
      <button id="newRoomButton">Go</button>
      <button id="soundButton" title="Toggle notification sound">🔔</button>
    </div>
    <div id="messages"></div>
    <input id="messageBox" placeholder="Type a message" maxlength="500">
    <button id="sendButton">Send</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script>
    const joinScreen = document.getElementById("joinScreen");
    const chatScreen = document.getElementById("chatScreen");
    const nameBox = document.getElementById("nameBox");
    const joinButton = document.getElementById("joinButton");
    const messageBox = document.getElementById("messageBox");
    const sendButton = document.getElementById("sendButton");
    const messages = document.getElementById("messages");
    const roomSelect = document.getElementById("roomSelect");
    const newRoomBox = document.getElementById("newRoomBox");
    const newRoomButton = document.getElementById("newRoomButton");
    const soundButton = document.getElementById("soundButton");

    // Paste your old random text here, or make a new one.
    const SITE_KEY = "change-me-to-something-random-48213";
    const BASE = "my-chatroom/" + SITE_KEY;
    const MAX_SHOWN = 50;

    // ---- WORD FILTER: add your own words to this list ----
    const BLOCKED_WORDS = ["badword", "otherbadword"];

    let myName = "";
    let currentRoom = "";
    let roomTopic = "";
    let enteredAt = 0;
    const rooms = new Set(["general", "random"]);
    const allMessages = [];
    const seenIds = new Set();

    let myId = localStorage.getItem("chatUserId");
    if (!myId) {
      myId = Math.random().toString(36).slice(2);
      localStorage.setItem("chatUserId", myId);
    }
    nameBox.value = localStorage.getItem("chatName") || "";

    // ---------- FILTER ----------
    function clean(text) {
      let result = text;
      BLOCKED_WORDS.forEach(function (word) {
        const safe = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const pattern = new RegExp("\\b" + safe + "\\b", "gi");
        result = result.replace(pattern, function (match) {
          return "*".repeat(match.length);
        });
      });
      return result;
    }

    // ---------- SOUND ----------
    let soundOn = localStorage.getItem("chatSound") !== "off";
    let audioCtx = null;

    function updateSoundButton() {
      soundButton.textContent = soundOn ? "🔔" : "🔕";
    }

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function beep() {
      if (!soundOn || !audioCtx) {
        return;
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    soundButton.addEventListener("click", function () {
      soundOn = !soundOn;
      localStorage.setItem("chatSound", soundOn ? "on" : "off");
      updateSoundButton();
      unlockAudio();
      beep();
    });
    updateSoundButton();

    // ---------- ROOMS ----------
    function cleanRoomName(raw) {
      return raw.trim().toLowerCase().replace(/\s+/g, "-").replace(/[^a-z0-9-]/g, "").slice(0, 20);
    }

    function updateRoomList() {
      roomSelect.innerHTML = "";
      Array.from(rooms).sort().forEach(function (name) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = "# " + name;
        option.selected = name === currentRoom;
        roomSelect.appendChild(option);
      });
    }

    function enterRoomOnBroker() {
      client.subscribe(roomTopic + "/#");
      client.publish(BASE + "/rooms/" + currentRoom, JSON.stringify({ name: currentRoom }), { retain: true });
    }

    function switchRoom(raw) {
      const name = cleanRoomName(raw);
      if (name === "" || name === currentRoom || clean(name) !== name) {
        updateRoomList();
        return;
      }
      if (currentRoom && client.connected) {
        client.unsubscribe(roomTopic + "/#");
      }
      currentRoom = name;
      roomTopic = BASE + "/r/" + name;
      allMessages.length = 0;
      seenIds.clear();
      enteredAt = Date.now();
      rooms.add(name);
      updateRoomList();
      render();
      if (client.connected) {
        enterRoomOnBroker();
      }
      history.replaceState(null, "", "?room=" + name);
    }

    roomSelect.addEventListener("change", function () {
      switchRoom(roomSelect.value);
    });
    newRoomButton.addEventListener("click", function () {
      switchRoom(newRoomBox.value);
      newRoomBox.value = "";
    });
    newRoomBox.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        newRoomButton.click();
      }
    });

    // ---------- CONNECTION ----------
    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

    client.on("connect", function () {
      client.subscribe(BASE + "/rooms/#");
      if (currentRoom) {
        enterRoomOnBroker();
      }
    });

    client.on("message", function (topic, data) {
      if (data.length === 0) {
        return;
      }
      let msg;
      try {
        msg = JSON.parse(data.toString());
      } catch (e) {
        return;
      }

      // A room announcement
      if (topic.startsWith(BASE + "/rooms/")) {
        if (typeof msg.name === "string") {
          const name = cleanRoomName(msg.name);
          if (name !== "" && clean(name) === name && !rooms.has(name)) {
            rooms.add(name);
            updateRoomList();
          }
        }
        return;
      }

      // A chat message, only for the room we're in
      if (!roomTopic || !topic.startsWith(roomTopic + "/")) {
        return;
      }
      if (typeof msg.id !== "string" || typeof msg.name !== "string" ||
          typeof msg.text !== "string" || typeof msg.time !== "number") {
        return;
      }
      if (seenIds.has(msg.id)) {
        return;
      }
      seenIds.add(msg.id);

      allMessages.push(msg);
      allMessages.sort(function (a, b) {
        return a.time - b.time;
      });
      if (allMessages.length > MAX_SHOWN) {
        allMessages.shift();
      }
      render();

      // Only beep for new messages from other people, not old history
      if (msg.userId !== myId && msg.time > enteredAt) {
        beep();
      }
    });

    // ---------- DISPLAY ----------
    function render() {
      messages.innerHTML = "";
      allMessages.forEach(showMessage);
      window.scrollTo(0, document.body.scrollHeight);
    }

    function showMessage(msg) {
      const bubble = document.createElement("div");
      bubble.className = "message";
      if (msg.userId === myId) {
        bubble.classList.add("mine");
      }

      const sender = document.createElement("span");
      sender.className = "sender";
      sender.textContent = clean(msg.name.slice(0, 20));

      const when = document.createElement("span");
      when.className = "time";
      when.textContent = new Date(msg.time).toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      });

      const body = document.createElement("div");
      body.textContent = clean(msg.text.slice(0, 500));

      bubble.appendChild(sender);
      bubble.appendChild(when);
      bubble.appendChild(body);
      messages.appendChild(bubble);
    }

    // ---------- JOIN + SEND ----------
    function join() {
      const name = nameBox.value.trim();
      if (name === "") {
        return;
      }
      myName = name;
      localStorage.setItem("chatName", name);
      unlockAudio();
      joinScreen.classList.add("hidden");
      chatScreen.classList.remove("hidden");

      const startRoom = new URLSearchParams(location.search).get("room") || "general";
      switchRoom(startRoom);
      if (!currentRoom) {
        switchRoom("general");
      }
      messageBox.focus();
    }

    function sendMessage() {
      const text = messageBox.value.trim();
      if (text === "" || !currentRoom) {
        return;
      }
      const id = Date.now() + "-" + Math.random().toString(36).slice(2);
      const msg = { id: id, userId: myId, name: myName, text: text, time: Date.now() };
      client.publish(roomTopic + "/" + id, JSON.stringify(msg), { retain: true });
      messageBox.value = "";
    }

    joinButton.addEventListener("click", join);
    sendButton.addEventListener("click", sendMessage);
    nameBox.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        join();
      }
    });
    messageBox.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
